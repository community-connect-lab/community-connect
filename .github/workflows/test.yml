name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          check-latest: true
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - name: Test release packaging and deployment failure handling
        run: python3 -m unittest discover -s scripts/deploy/tests -v
      - name: Test host release validation and rollback
        run: python3 -m unittest discover -s scripts/deploy -p 'test_deploy_release.py' -v
